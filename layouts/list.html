{{ define "main" }}
  {{ partial "page-header" . }}

  <section class="section">
    <div class="container">
      <div class="row justify-center">
        <div class="lg:col-10">
          {{ range .Pages.ByWeight }}
            <a href="{{ .Permalink }}" class="block mb-6 rounded-lg border border-border dark:border-darkmode-border p-6 transition hover:shadow-lg hover:border-primary dark:hover:border-darkmode-primary bg-body dark:bg-darkmode-body">
              <h3 class="mb-2 text-text-dark dark:text-darkmode-text-dark text-xl font-semibold">
                {{ .Title }}
              </h3>
              {{ with .Description }}
                <p class="text-text-light dark:text-darkmode-text-light text-sm">{{ . }}</p>
              {{ end }}
              {{ with .Params.categories }}
                <div class="mt-3">
                  {{ range . }}
                    <span class="inline-block rounded bg-light dark:bg-darkmode-light px-2 py-1 text-xs text-text-light dark:text-darkmode-text-light">
                      {{ . }}
                    </span>
                  {{ end }}
                </div>
              {{ end }}
            </a>
          {{ end }}
        </div>
      </div>
    </div>
  </section>
{{ end }}
